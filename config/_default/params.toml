# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "sakura"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

defaultThemeColor = "#f8f3f1"

enableSearch = true
enableCodeCopy = false
enableImageLazyLoading = true
enableImageWebp = true

# robots = ""
fingerprintAlgorithm = "sha256"

[palette]
  enabled = true
  default = "sakura"
  options = ["sakura", "latex", "congo", "ocean", "slate", "cherry"]

[header]
  layout = "hybrid" # valid options: basic, hamburger, hybrid, custom
  # logo = "img/logo.jpg"
  # logoDark = "img/dark-logo.jpg"
  showTitle = true

[banner]
  # Sticky announcement banner; set to true and fill in text to enable
  enabled = true
  text = "🎉 Welcome! Here I record my daily moments."
  showLatestPost = true   # Show the latest post title; click to jump and close banner
  showUpdateDate = true   # Show the latest post's published date badge
  # url = "/posts/"         # Optional, extra link button
  # linkText = "View Details" # Optional, link button text

[footer]
  showCopyright = true
  # Copyright start year; footer displays as © 2018–current year Author Name
  copyrightSince = 2018
  showThemeAttribution = true
  showAppearanceSwitcher = false
  showScrollToTop = true
  # Footer RSS subscription entry
  rssURL = "/posts/index.xml"
  # Footer "Umami Analytics" public dashboard link
  umamiShareURL = "https://cloud.umami.is/analytics/us/share/29fuPWtjBtq9fbvm"

[homepage]
  layout = "profile" # valid options: page, profile, custom
  showRecent = false
  recentLimit = 10
  showFeatured = true   # Article front matter: featured: true
  featuredLimit = 100     # Number of featured items; sorting uses front matter weight (higher = more prominent)

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  # editURL = "https://github.com/username/repo/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = false
  showTableOfContents = true
  # Show categories/tags under article title (clickable to corresponding lists)
  showTaxonomies = true
  showWordCount = false
  # Article footer Giscus; individual articles can disable with front matter: showComments: false
  showComments = true
  # sharingLinks = ["facebook", "x-twitter", "mastodon", "pinterest", "reddit", "linkedin", "email", "threads", "telegram", "line", "weibo", "xing", "bluesky"]
   sharingLinks = ["x-twitter","email","bluesky"]

[list]
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  # Show categories/tags on list cards as well
  showTaxonomies = true
  groupByYear = true
  paginationWidth = 1

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showChart = true       # Statistics chart on categories/tags overview page
  chartTagTopN = 20      # Tag page bars only show top N by post count

[fathomAnalytics]
  # site = "ABC12345"

[plausibleAnalytics]
  # domain = "blog.yoursite.com"
  # event = ""
  # script = ""

[umamiAnalytics]
  site = "e8dda199-cdc2-4bb5-8aeb-1a6bd156ada7"
  region = "eu"  # Official cloud: eu or us; for self-hosted see script below
  # script = "https://your-domain.com/script.js"  # Uncomment and fill in for self-hosting

[verification]
  # google = ""
  # bing = ""
  # pinterest = ""
  # yandex = ""

# Giscus Comments (https://giscus.app/)
# 1. Repository Settings → General → Features → Enable Discussions
# 2. Install https://github.com/apps/giscus on your repository
# 3. Open giscus.app, enter your repo, copy the generated repo id / category id and paste below
[giscus]
  repo = "Excalibra/excalibra.github.io"
  repoID = "R_kgDONa7BCg"                        # Required, format: R_kgDO...
  category = "Announcements"                     # Change to your discussion category name
  categoryID = "YOUR_CATEGORY_ID_HERE"           # Required, format: DIC_kwDO... (get from giscus.app)
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  lang = "en"                                    # Changed from zh-CN to English
  loading = "lazy"
  # Custom Giscus theme must be served from a public HTTPS URL for both local preview and production iframe
  themeBaseURL = "https://Excalibra.github.io/giscus"  
  # Theme base path used locally when themeBaseURL is not set
  themeBasePath = "giscus"
  # Fallback themes: used when custom theme is unavailable
  themeLight = "noborder_light"
  themeDark = "noborder_dark"
