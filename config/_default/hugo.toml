baseURL = "https://excalibra.github.io/"
defaultContentLanguage = "zh-cn"

enableRobotsTXT = true
summaryLength = 0

[permalinks]
  [permalinks.page]
    posts = "/posts/:year/:slug/"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.googleAnalytics]
    ID = "G-EFEVDFSN55"
  [services.x]
    disableInlineCSS = true

[module]
  [[module.imports]]
    path = "github.com/hugomods/umami-analytics"

[params.services.umami_analytics]
  id = "03e4dc18-2dfd-496e-a937-725a016e3312"
  script_url = "https://cloud.umami.is/script.js"
